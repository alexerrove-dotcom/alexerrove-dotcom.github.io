<!doctype html><html lang="ru"><meta charset="utf-8"><title>Clone API Smoke Test</title><body style="font:16px system-ui;max-width:550px;margin:30px auto"><h1>Проверка API клонирования Fox Voice</h1><button id="go">Проверить вызов голосовой модели</button><pre id="status">Ожидание</pre><audio id="result" controls></audio><script type="module">
import {Client,handle_file} from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
const $=id=>document.getElementById(id);
$("go").onclick=async()=>{try{$("status").textContent="Загружаю демонстрационный аудиообразец...";const res=await fetch("https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/565dc7c6-760d-4a45-877b-89933bf0dc64.mp3");if(!res.ok)throw Error("Sample HTTP "+res.status);const b=await res.blob();$("status").textContent="Образец "+b.size+" байт; подключаюсь к Qwen";const c=await Client.connect("hoolatech/Qwen3-TTS");$("status").textContent="Генерирую...";const p=await c.predict("/generate_voice_clone",{ref_audio:handle_file(b),ref_text:"Ой! Ты это видел? Там, за деревом, что-то светится! Побежали скорее, пока оно не исчезло!",target_text:"Привет! Я маленький лисёнок!",language:"Russian",use_xvector_only:false,model_size:"0.6B"});const obj=p.data?.[0];$("status").textContent=JSON.stringify({message:p.data?.[1],audio:obj},null,2);$("result").src=obj?.url||"";}catch(e){$("status").textContent="ERROR: "+String(e?.stack||e)}};
</script></body></html>
