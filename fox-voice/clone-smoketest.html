<!doctype html><html lang="ru"><meta charset="utf-8"><title>Clone API Smoke Test</title><body style="font:16px system-ui;max-width:550px;margin:30px auto"><h1>Проверка API клонирования Fox Voice</h1><button id="go">Проверить вызов голосовой модели</button><pre id="status">Ожидание</pre><audio id="result" controls></audio><script type="module">
import {Client,handle_file} from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";
const $=id=>document.getElementById(id);
$("go").onclick=async()=>{try{$("status").textContent="Загружаю демонстрационный аудиообразец...";const rate=22050, len=rate*5, raw=new Float32Array(len);for(let i=0;i<len;i++){const t=i/rate;const period=Math.floor(t*3)%3;const f=period===0?220:period===1?275:195;const env=Math.min(1,(t%0.33)*25,(0.33-(t%0.33))*24);raw[i]=.23*Math.max(0,env)*(Math.sin(2*Math.PI*f*t)+.38*Math.sin(4*Math.PI*f*t)+.13*Math.sin(6*Math.PI*f*t));}const bytes=new ArrayBuffer(44+raw.length*2),v=new DataView(bytes);const word=(i,s)=>{for(let j=0;j<s.length;j++)v.setUint8(i+j,s.charCodeAt(j))};word(0,"RIFF");v.setUint32(4,36+raw.length*2,true);word(8,"WAVE");word(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);word(36,"data");v.setUint32(40,raw.length*2,true);for(let i=0;i<raw.length;i++)v.setInt16(44+i*2,raw[i]*32000,true);const b=new Blob([bytes],{type:"audio/wav"});$("status").textContent="Создан синтетический безличный голосовой тест "+b.size+" байт. Подключаюсь...";const c=await Client.connect("hoolatech/Qwen3-TTS");$("status").textContent="Генерирую...";const p=await c.predict("/generate_voice_clone",{ref_audio:handle_file(b),ref_text:"",target_text:"Привет! Я маленький лисёнок!",language:"Russian",use_xvector_only:true,model_size:"0.6B"});const obj=p.data?.[0];$("status").textContent=JSON.stringify({message:p.data?.[1],audio:obj},null,2);$("result").src=obj?.url||"";}catch(e){$("status").textContent="ERROR: "+String(e?.stack||e)}};
</script></body></html>
