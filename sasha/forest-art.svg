<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" role="img" aria-labelledby="title desc">
<title id="title">Лисёнок Саша отправляется в лесное приключение</title>
<desc id="desc">Сказочная иллюстрация: рыжий лисёнок в бирюзовом шарфе на тропе в лунном волшебном лесу.</desc>
<defs>
