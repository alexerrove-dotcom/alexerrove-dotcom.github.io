<radialGradient id="mist"><stop stop-color="#d9e8b6" stop-opacity=".36"/><stop offset="1" stop-color="#d9e8b6" stop-opacity="0"/></radialGradient>
<linearGradient id="fur" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffcf73"/><stop offset=".34" stop-color="#fa8c38"/><stop offset=".9" stop-color="#b84c2a"/></linearGradient>
<linearGradient id="tail" x1="0" x2="1" y1="0" y2=".8"><stop stop-color="#9d3b27"/><stop offset=".58" stop-color="#e96b32"/><stop offset="1" stop-color="#ffb452"/></linearGradient>
<linearGradient id="muzzle" x1="0" x2=".8" y1=".1" y2="1"><stop stop-color="#fff4cf"/><stop offset="1" stop-color="#edce9f"/></linearGradient>
<linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6edec9"/><stop offset="1" stop-color="#166a73"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="shad" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#091e1a" flood-opacity=".35"/></filter>
