<title id="ttl">Лисёнок Саша — герой приключения</title><desc id="desc">Рыжий лисёнок с большим пушистым хвостом, бирюзовым шарфом и походным снаряжением стоит на лесной тропе.</desc>
<defs>
<radialGradient id="aura"><stop stop-color="#ffecb6" stop-opacity=".6"/><stop offset=".52" stop-color="#b1e0b0" stop-opacity=".18"/><stop offset="1" stop-color="#cce9ae" stop-opacity="0"/></radialGradient>
<linearGradient id="fur" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#ffd085"/><stop offset=".29" stop-color="#f9a34d"/><stop offset=".67" stop-color="#e27c37"/><stop offset="1" stop-color="#b75030"/></linearGradient>
<linearGradient id="ear" x1="0" x2="1" y1="0" y2=".8"><stop stop-color="#ffcfab"/><stop offset="1" stop-color="#c56f6b"/></linearGradient>
<linearGradient id="cream" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fffcdf"/><stop offset=".6" stop-color="#ffe0ae"/><stop offset="1" stop-color="#d3b58d"/></linearGradient>
<linearGradient id="teal" x1="0" x2="1" y1=".1" y2="1"><stop stop-color="#80e5c7"/><stop offset=".35" stop-color="#3cb6b0"/><stop offset=".72" stop-color="#247f87"/><stop offset="1" stop-color="#164b69"/></linearGradient>
<linearGradient id="leather"><stop stop-color="#b98c58"/><stop offset=".45" stop-color="#805233"/><stop offset="1" stop-color="#4c3029"/></linearGradient>
<linearGradient id="vest" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#b1a57b"/><stop offset=".44" stop-color="#6f8259"/><stop offset="1" stop-color="#41573e"/></linearGradient>
<linearGradient id="boot" x1="0" x2=".8" y1="0" y2="1"><stop stop-color="#8b603b"/><stop offset=".5" stop-color="#57392d"/><stop offset="1" stop-color="#3b2b28"/></linearGradient>
<filter id="shadow"><feDropShadow dx="1" dy="13" stdDeviation="13" flood-color="#061e1a" flood-opacity=".53"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
