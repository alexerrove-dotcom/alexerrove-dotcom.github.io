name: Build SpriteForge on-device WebGPU
on:
  workflow_dispatch:
  push:
    paths:
      - 'spriteforge/webgpu-src/**'
      - '.github/workflows/spriteforge-webgpu.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-only model runtime
        working-directory: spriteforge/webgpu-src
        run: npm install --no-audit --no-fund
      - name: Build WebGPU worker bundles
        working-directory: spriteforge/webgpu-src
        run: npm run build
      - name: Inspect built assets
        run: |
          ls -lh spriteforge/webgpu/
          test -s spriteforge/webgpu/bundle.js
          node --check spriteforge/webgpu/bundle.js
      - name: Publish assets to GitHub Pages directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f spriteforge/webgpu
          if ! git diff --cached --quiet; then
            git commit -m "Publish on-device WebGPU runtime [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
