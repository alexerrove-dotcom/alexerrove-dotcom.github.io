name: Deploy SpriteForge to Hugging Face ZeroGPU
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage Space sources
        run: |
          mkdir -p /tmp/spriteforge-space
          cp spriteforge/hf-space/app.py /tmp/spriteforge-space/app.py
          cp spriteforge/hf-space/requirements.txt /tmp/spriteforge-space/requirements.txt
          cp spriteforge/hf-space/README.md /tmp/spriteforge-space/README.md
          cp spriteforge/backend/app.py /tmp/spriteforge-space/spriteforge_backend.py
          python -m py_compile /tmp/spriteforge-space/*.py
      - name: Install Hub client
        run: python -m pip install 'huggingface_hub>=0.35,<2'
      - name: Deploy GPU Space (free ZeroGPU only)
        id: deploy_space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ.get('HF_TOKEN','')
          if not token:
              raise SystemExit('Add the Hugging Face token in GitHub Actions secret HF_TOKEN first.')
          api = HfApi(token=token)
          login = api.whoami()['name']
          space = login + '/spriteforge-ru'
          api.create_repo(repo_id=space,repo_type='space',space_sdk='gradio',space_hardware='zero-a10g',exist_ok=True)
          api.upload_folder(repo_id=space,repo_type='space',folder_path='/tmp/spriteforge-space',commit_message='Deploy independent SpriteForge RU GPU generator')
          api.request_space_hardware(repo_id=space,hardware='zero-a10g')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as out:
              out.write('space_id='+space+'\n')
          print('Space deployed: https://huggingface.co/spaces/'+space)
          print('Requested free ZeroGPU hardware; check actual Running status in Hugging Face.')
          PY
      - name: Connect website to the deployed Space
        uses: actions/github-script@v7
        env:
          SPACE_ID: ${{ steps.deploy_space.outputs.space_id }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const path = 'spriteforge/config.json';
            const file = await github.rest.repos.getContent({owner,repo,path});
            const content = Buffer.from(JSON.stringify({space_id: process.env.SPACE_ID},null,2) + '\n').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,content,sha:file.data.sha,
              message:'Auto-connect SpriteForge RU to own Hugging Face GPU Space'
            });
            core.info('SpriteForge site config now points to ' + process.env.SPACE_ID);
