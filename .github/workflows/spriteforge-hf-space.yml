name: Deploy SpriteForge to Hugging Face ZeroGPU
on:
  workflow_dispatch:
    inputs:
      space_id:
        description: 'Hugging Face Space, e.g. yourname/spriteforge-ru'
        type: string
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stage Space sources
        run: |
          mkdir -p /tmp/spriteforge-space
          cp spriteforge/hf-space/app.py /tmp/spriteforge-space/app.py
          cp spriteforge/hf-space/requirements.txt /tmp/spriteforge-space/requirements.txt
          cp spriteforge/hf-space/README.md /tmp/spriteforge-space/README.md
          cp spriteforge/backend/app.py /tmp/spriteforge-space/spriteforge_backend.py
          python -m py_compile /tmp/spriteforge-space/*.py
      - name: Install Hub CLI
        run: python -m pip install 'huggingface_hub>=0.35,<2'
      - name: Upload to Hugging Face (only free ZeroGPU is requested)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: ${{ inputs.space_id }}
        run: |
          python - <<'PY'
          import os,re
          from huggingface_hub import HfApi
          space=os.environ['SPACE_ID']
          token=os.environ.get('HF_TOKEN','')
          if not re.fullmatch(r'[\w.-]+/[\w.-]+', space):
              raise SystemExit('Space ID must be username/space-name')
          if not token:
              raise SystemExit('Set the HF_TOKEN secret in GitHub Actions first.')
          api=HfApi(token=token)
          api.create_repo(repo_id=space,repo_type='space',space_sdk='gradio',exist_ok=True)
          api.upload_folder(repo_id=space,repo_type='space',folder_path='/tmp/spriteforge-space',commit_message='Deploy independent SpriteForge RU ZeroGPU generator')
          api.request_space_hardware(repo_id=space,hardware='zero-a10g')
          print('Uploaded Space: https://huggingface.co/spaces/'+space)
          print('Hardware requested: zero-a10g (free ZeroGPU, if eligible)')
          PY
