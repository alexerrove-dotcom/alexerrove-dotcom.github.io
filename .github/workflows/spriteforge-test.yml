name: SpriteForge CPU smoke tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'spriteforge/**'
      - '.github/workflows/spriteforge-test.yml'
jobs:
  demo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU demo dependencies
        run: python -m pip install -r spriteforge/backend/requirements.txt
      - name: Compile and smoke test
        working-directory: spriteforge/backend
        run: |
          python -m py_compile app.py
          python -m unittest -v test_demo
          python -m py_compile ../hf-space/app.py
      - name: Check browser JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('spriteforge/index.html','utf8');
          const scripts = [...html.matchAll(/<script(?:[^>]*)>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No inline script found');
          for (const [,js] of scripts) new Function(js);
          console.log('SpriteForge front-end JavaScript parsed successfully');
          NODE
          node --check spriteforge/local-generator.js
          node --check spriteforge/neural-engine.js
          node --check spriteforge/test_webgpu.mjs

      - name: Browser E2E demo test
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          python -m http.server 8765 --directory . >/tmp/spriteforge-http.log 2>&1 &
          node spriteforge/test_frontend.mjs
          node spriteforge/test_webgpu.mjs
          node spriteforge/test_art_preview.mjs
