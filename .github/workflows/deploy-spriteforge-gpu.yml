name: Deploy SpriteForge GPU Space
on:
  workflow_dispatch:
  push:
    paths:
      - 'spriteforge/gpu-space/**'
      - '.github/workflows/deploy-spriteforge-gpu.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugging Face deployment client
        run: python -m pip install 'huggingface_hub>=0.35,<2'
      - name: Stage public Static Space or activate granted GPU
        run: |
          python spriteforge/gpu-space/deploy_hf.py
