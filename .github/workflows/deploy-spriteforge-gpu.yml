name: Deploy SpriteForge GPU Space
on:
  workflow_dispatch:
  push:
    paths:
      - 'spriteforge/gpu-space/**'
      - '.github/workflows/deploy-spriteforge-gpu.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow for CPU-only validation
        run: python -m pip install 'Pillow>=10.2,<13'
      - name: Verify pose guides and spritesheet export
        run: |
          cd spriteforge/gpu-space
          PYTHONPATH=. python tests/test_core.py
          python -m py_compile core.py app.py deploy_hf.py

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugging Face deployment client
        run: python -m pip install 'huggingface_hub>=0.35,<2'
      - name: Stage public Static Space or activate granted GPU
        run: |
          python spriteforge/gpu-space/deploy_hf.py
